name: Feature request
description: Propose a scoped product, compatibility, or governance improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem. Stinky Cobbler 3.x is a declarative AI agent toolkit package manager. The 2.x governance commands are marked `[deprecated 2.x]` and frozen. `entry` and `toolkit` are current. 4.0 only decides removal. It is still not a host sandbox.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is blocked, by what concrete behavior, and why existing behavior is insufficient?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
      description: Describe observable success, not only a proposed implementation.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Intended layer
      options:
        - Toolkit package (skill/MCP/instructions)
        - Engine-enforced CLI/MCP gate
        - Host-procedural integration
        - Compatibility or migration
        - Documentation or community workflow
        - Unsure
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and product boundaries
      description: Explain authority, scope, failure mode, rollback, audit, user data, and how bypass channels remain represented.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note CLI/schema/config/persisted-record/install-host effects and the migration path for existing users.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
