name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version; must exactly match the package.json version (for example 2.0.1)."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - "22"
          - "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - name: Require git tag to match package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_GATE_GIT_REF: ${{ github.ref_name }}
        run: node scripts/release-gate.mjs
      - name: Require workflow_dispatch version to match package version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_GATE_EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_GATE_GIT_REF: ${{ github.ref_name }}
        run: node scripts/release-gate.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:package

  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - name: Require git tag to match package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_GATE_GIT_REF: ${{ github.ref_name }}
        run: node scripts/release-gate.mjs
      - name: Require workflow_dispatch version to match package version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_GATE_EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_GATE_GIT_REF: ${{ github.ref_name }}
        run: node scripts/release-gate.mjs
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Generate dependency SBOM
        run: node scripts/generate-sbom.mjs --out "stinky-cobbler-$(node -p \"require('./package.json').version\").sbom.cyclonedx.json"
      - name: Generate, inspect, and checksum the exact release tarball
        run: |
          npm pack --json
          node scripts/package-smoke.mjs --tarball "stinky-cobbler-$(node -p \"require('./package.json').version\").tgz"
          node scripts/generate-checksum.mjs --kind tarball --file "stinky-cobbler-$(node -p \"require('./package.json').version\").tgz"
      - name: Build and verify the lockfile-pinned offline bundle
        run: |
          node scripts/build-offline-bundle.mjs
          node scripts/generate-checksum.mjs --kind offline --file "stinky-cobbler-$(node -p \"require('./package.json').version\")-offline-full.zip"
          node scripts/verify-offline-bundle.mjs
      - name: Generate the standalone manual from its tracked source
        run: node scripts/generate-release-manual.mjs
      - name: Verify SBOM and checksum artifacts
        run: node scripts/verify-release-artifacts.mjs
      - name: Emit validated release provenance
        id: provenance
        env:
          RELEASE_GATE_GIT_REF: ${{ github.ref_name }}
          RELEASE_GATE_EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_PROVENANCE_EVENT: ${{ github.event_name }}
          RELEASE_PROVENANCE_SHA: ${{ github.sha }}
        run: node scripts/release-provenance.mjs
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stinky-cobbler-${{ steps.provenance.outputs.version }}-${{ steps.provenance.outputs.ref }}-${{ steps.provenance.outputs.sha }}
          path: |
            stinky-cobbler-*.tgz
            stinky-cobbler-*.tgz.sha256
            stinky-cobbler-*-offline-full.zip
            stinky-cobbler-*-offline-full.zip.sha256
            stinky-cobbler-*.sbom.cyclonedx.json
            STINKY-COBBLER-MANUAL.md
          if-no-files-found: error
