# Stinky Cobbler orchestration defaults (builtin tier).
# Do NOT edit this file — the package update overwrites it.
# Advanced users: copy entries you want to change into
#   .stinky-cobbler/policies/orchestration.yaml
# (workspace overlay wins over this builtin; every key here is the fallback).
version: 1
defaults:
  # Budget: global cumulative caps (never reset across rounds)
  maxRounds: 5
  maxRetriesPerSubtask: 2
  maxSubtaskTokens: 200000
  # Cost estimation model (shown before run create)
  costTokensPerSubtaskRound: 8000
  orchestrateTokenThreshold: 50000
  # Limits (advanced users may raise; schema remains the last-resort ceiling)
  maxContractCriteria: 20
  maxSubtaskCriteria: 10
  maxDefects: 20
  maxInputArtifacts: 20
  maxContractScopeItems: 50
  maxSubtaskScopeItems: 50
  maxDomainLength: 64
  maxDomainInstructions: 30
  # Controlled writes
  maxWriteContentBytes: 1048576
  # Scheduling scale caps
  maxSteps: 10
  maxParallel: 4
  maxWritesPerBatch: 20
  # Lease defaults
  leaseDefaultToolCalls: 20
  leaseDefaultMinutes: 60
  leaseMaxMinutes: 1440
  leaseGraceMinutes: 15
  # Convergence guard (anti-polish): same defect fingerprint escalating count.
  # TIGHTEN-ONLY: values above 2 are rejected at load time.
  oscillationThreshold: 2
  # Engine auto-reject: ACCEPTED reviews scoring below this are forced REJECTED (0 disables).
  autoRejectScoreThreshold: 0
  # Round consistency check failure auto-escalates the run (default: human judgment).
  autoEscalateOnConsistencyFail: false
# Append-only sensitive paths: workspace-specific forbidden targets.
# Entries here are ADDITIONS to the built-in sensitive list (never removable).
# Leave empty unless your project has its own secret locations (e.g. internal/, secrets/).
sensitiveExtraPaths: []
